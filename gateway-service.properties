server.port=8080
spring.application.name=gateway-service

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ============================================
# ROUTE 1: order-service endpoints
# ============================================
spring.cloud.gateway.routes[0].id=order-get-details
spring.cloud.gateway.routes[0].uri=lb://order-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/get-details

spring.cloud.gateway.routes[1].id=order-get-ref-services
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/get-ref-services

spring.cloud.gateway.routes[2].id=order-search-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/search-service

# ============================================
# ROUTE 3: inventory-service endpoints
# ============================================
spring.cloud.gateway.routes[3].id=inventory-service-details
spring.cloud.gateway.routes[3].uri=lb://inventory-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/service-details

# Actuator
management.endpoints.web.exposure.include=health,info,gateway