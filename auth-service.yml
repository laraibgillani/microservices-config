
server:
  port: 8084

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Custom properties
app:
  jwt:
    secret: "mySuperSecretKeyForJwtSigningMustBeAtLeast32BytesLong!!"
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000