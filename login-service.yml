server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce_db
    username: root
    password: root

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    jersey:
      enabled: false

logging:
  level:
    org.springframework.security: DEBUG