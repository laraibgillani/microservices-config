


server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ecommerce_db
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    jersey:
      enabled: false